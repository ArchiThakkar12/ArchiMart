

#-----------SERVICE EXCEPTIONS-------------------
CustomerService.INVALID_CREDENTIALS = Email id or password is incorrect.
CustomerService.EMAIL_ID_ALREADY_IN_USE = The email id is already in use. Please try with a new email id
CustomerService.PHONE_NUMBER_ALREADY_IN_USE = The phone number is already in use. Please try with a new phone number
CustomerService.CUSTOMER_NOT_FOUND = No customer found with the email id


CustomerAPI.CUSTOMER_REGISTRATION_SUCCESS = You are successfully registered as customer with Email Id: 
CustomerAPI.CUSTOMER_ADDRESS_DELETED_SUCCESS = The address has been successfully deleted.
CustomerAPI.UPDATE_ADDRESS_SUCCESS = The address has been successfully updated.
