OrderService.INSUFFICIENT_STOCK = Sorry!! We will not be able to take order as there is insufficient stock. Please reduce the quantity.
OrderService.ADDRESS_NOT_AVAILABLE = No address available for delivery
OrderService.ORDER_NOT_FOUND = Order not found 
OrderService.NO_ORDERS_FOUND =No orders are found for customer email id
OrderService.TRANSACTION_ALREADY_DONE = Order is already confirmed cannot change its status.


ProductService.PRODUCT_NOT_AVAILABLE=Sorry product is not available.


